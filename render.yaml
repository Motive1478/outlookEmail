services:

  - type: web

    name: outlookemail

    env: docker


    plan: free


    region: singapore


    autoDeploy: true


    envVars:

      - key: PORT
        value: 8080


      - key: LOGIN_PASSWORD
        value: Admin@123456


      - key: SECRET_KEY
        generateValue: true


    disk:

      name: outlook-data

      mountPath: /app/data

      sizeGB: 1
